name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: >-
            This isn't a request for help bypassing a purchase, license
            check, or DRM. See docs/TERMS.md.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Rough is fine. If it touches native/, see docs/ARCHITECTURE.md first.
