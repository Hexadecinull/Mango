name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew :core:build :core:test --stacktrace

      - name: Upload core jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-jar
          path: core/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: ignore

  desktop-app:
    # desktop/ is the Windows/macOS APK-inspection helper now, not where
    # Linux support lives (see linux/ and docs/ARCHITECTURE.md), so this
    # builds on windows-latest instead of ubuntu-latest.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # gradlew.bat, not gradlew: default shell here is pwsh, which can't
      # run a script starting with a #!/bin/sh shebang line.
      - run: ./gradlew.bat :desktop:build :desktop:createDistributable --stacktrace

      - name: Upload desktop app image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # createDistributable produces a runnable app image, not an
          # installer, and needs no OS packaging tools, which keeps this
          # reliable without relying on WiX being present on the runner.
          # A real Msi via :desktop:packageMsi is a follow-up, untested here.
          name: desktop-app-windows
          path: desktop/build/compose/binaries/main/app/
          if-no-files-found: warn

  native:
    # native/ is a standalone CMake project, not wired into the Gradle
    # build yet (see docs/BUILDING.md). This job is informational while
    # it's still an early proof of concept; it's allowed to fail so it
    # doesn't block unrelated PRs.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Configure and build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S native -B native/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build native/build

      - name: Upload translator .so
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libmango_translator-arm64-v8a
          path: native/build/libmango_translator.so
          if-no-files-found: warn

  module:
    # Packages the flashable zip end to end. Depends on native's .so, which
    # is itself still an early proof of concept (see that job's comment),
    # so this is allowed to fail for the same reason rather than blocking
    # unrelated PRs.
    runs-on: ubuntu-latest
    needs: native
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Download translator .so
        uses: actions/download-artifact@v7
        with:
          name: libmango_translator-arm64-v8a
          path: native/build/
      - run: bash scripts/package_module.sh

      - name: Upload compiled module
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mango-module
          path: build/mango-module.zip
          if-no-files-found: warn

  linux:
    # linux/ is a standalone CMake project like native/, but builds with
    # the host's own toolchain, no NDK needed, see linux/README.md. Still
    # a proof of concept, so allowed to fail like the native job above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build
        run: |
          cmake -S linux -B linux/build
          cmake --build linux/build
      - name: Run selfcheck
        run: ./linux/build/mango_linux_selfcheck

      - name: Upload linux binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mango-linux
          path: |
            linux/build/mango_linux_selfcheck
            linux/build/mango_linux_loader
          if-no-files-found: warn
